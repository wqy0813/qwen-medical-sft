name: Deploy Qwen2.5 MedExpQA Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "release/qwen25-medexpqa/predictions.jsonl"
      - "scripts/build_qwen25_pages.py"
      - "scripts/rescore_qwen25_medexpqa.py"
      - "src/medical_sft/**"
      - ".github/workflows/qwen25-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build Qwen2.5 case explorer
        run: python3 scripts/build_qwen25_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/qwen25-pages
      - uses: actions/deploy-pages@v5
        id: deployment
